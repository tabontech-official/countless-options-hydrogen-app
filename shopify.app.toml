# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "79e42b949688b5a9cd19059d7faf716c"
name = "Countless Options"
application_url = "https://countless-options-hydrogen-app.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_files + write_app_proxy: customers' "File upload" answers go to the shop's Files (app/routes/proxy.upload.jsx).
# read_markets: the Catalog condition groups catalogs by kind (region, retail, company location), as Shopify's admin does.
scopes = "write_products,read_themes,write_cart_transforms,write_publications,write_files,write_app_proxy,read_markets"

# Storefront path /apps/countless-options/* reaches this app's /proxy/* routes.
# Merchants can rename it per store in Settings > Apps; product-options-upload.js assumes this default.
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "countless-options"

# Merged fields of every active option set on the product, written by app/options.server.js
# and rendered by the theme block. Prisma holds the source of truth.
[product.metafields.app.options]
type = "json"
name = "Product options"
access.storefront = "public_read"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  # A product whose tags, vendor or type change may start or stop matching an option set's conditions.
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/create", "products/update" ]

  # Products added to or removed from a collection may start or stop matching a Collection condition.
  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/update"
  topics = [ "collections/update" ]

  # Mandatory for public apps.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://countless-options-hydrogen-app.vercel.app/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
